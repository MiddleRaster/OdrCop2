name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  SOLUTION_FILE_PATH: OdrCop2.slnx
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Download LLVM SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download llvm-sdk-2026-06-01 `
            --repo ${{ github.repository }} `
            --pattern "llvm.zip" `
            --dir .

      - name: Extract LLVM SDK
        run: |
          Expand-Archive llvm.zip -DestinationPath .

      - name: Build Solution
        run: |
          msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Run TDD Tests
        run: |
          .\x64\Release\tdd.exe
